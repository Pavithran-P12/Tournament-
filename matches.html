  <main class="mc">
   <section class="mc-top">
    <div class="wrap">
    <div class="mc-head">
      <h1>Matches</h1>
      <div class="progress" data-progress></div>
    </div>

    <div data-day-plan></div>
    <div class="tabs cat-tabs" role="tablist" aria-label="Category" data-cat-tabs></div>
    <div class="tabs view-tabs" role="tablist" aria-label="View" data-view-tabs>
      <button type="button" role="tab" data-view="groups">Groups</button>
      <button type="button" role="tab" data-view="schedule">Schedule</button>
      <button type="button" role="tab" data-view="knockout">Knockout</button>
    </div>

    <div class="filters" data-filters>
      <div class="chips" role="group" aria-label="Match status" data-status-chips>
        <button type="button" data-status="all">All</button>
        <button type="button" data-status="live">Live</button>
        <button type="button" data-status="upcoming">Upcoming</button>
        <button type="button" data-status="completed">Completed</button>
      </div>
      <label class="select">
        <span>Group</span>
        <select data-group><option value="all">All groups</option></select>
      </label>
      <label class="select">
        <span>Stage</span>
        <select data-round>
          <option value="all">All stages</option>
        </select>
      </label>
    </div>
    </div>
   </section>
   <section class="mc-body">
    <div class="wrap" data-view-body aria-live="polite"></div>
   </section>
  </main>
