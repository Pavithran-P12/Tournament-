<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match | ThirdSpace Play</title>
  <meta name="description" content="Live scoreboard for a ThirdSpace Play Badminton Tournament match.">
  <meta name="theme-color" content="#0E4A41">
  <link rel="icon" href="assets/img/thirdspace-logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=20261025o">
</head>
<body class="page-match">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ThirdSpace Play home">
      <img class="brand-logo" src="assets/img/thirdspace-logo-96.png" alt="" width="36" height="36">
      <span>ThirdSpace <strong>Play</strong></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Results</a>
      <a href="matches.html">Matches <span class="live-count" data-live-count hidden></span></a>
      <a href="schedule.html"><span>Schedule<span class="nav-long"> &amp; rules</span></span></a>
    </nav>
  </header>

  <main class="wrap match" data-match-root>
    <a class="back" href="matches.html">All matches</a>

    <div class="match-head">
      <div>
        <p class="match-cat" data-cat></p>
        <h1 class="match-title" data-title></h1>
        <p class="match-meta" data-meta></p>
        <p class="report-chip" data-report></p>
      </div>
      <div class="head-actions">
        <div data-status></div>
        <button type="button" class="icon-btn" data-share hidden aria-label="Share result image" title="Share result">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="match-grid">
      <div class="court-wrap">
        <div class="court" data-court>
          <svg class="court-svg" viewBox="0 0 610 1340" preserveAspectRatio="none" aria-hidden="true">
            <rect x="2" y="2" width="606" height="1336" />
            <line x1="46" y1="2" x2="46" y2="1338" />
            <line x1="564" y1="2" x2="564" y2="1338" />
            <line x1="2" y1="78" x2="608" y2="78" />
            <line x1="2" y1="1262" x2="608" y2="1262" />
            <line x1="2" y1="472" x2="608" y2="472" />
            <line x1="2" y1="868" x2="608" y2="868" />
            <line x1="305" y1="2" x2="305" y2="472" />
            <line x1="305" y1="868" x2="305" y2="1338" />
            <line class="net" x1="-10" y1="670" x2="620" y2="670" />
          </svg>
          <div class="half half-a" data-half="A">
            <p class="half-team" data-team="A"></p>
            <p class="half-score" data-score="A">0</p>
          </div>
          <div class="half half-b" data-half="B">
            <p class="half-score" data-score="B">0</p>
            <p class="half-team" data-team="B"></p>
          </div>
          <p class="net-chip" data-net-chip hidden></p>
          <span class="shuttle-marker" data-shuttle hidden><img src="assets/img/shuttle.svg" alt=""><span class="sr-only" data-serve-text></span></span>
        </div>
        <div class="games-box" data-games hidden></div>
        <p class="sr-only" aria-live="polite" data-announce></p>
      </div>

      <div class="match-side">
        <section class="scorer" data-scorer hidden aria-labelledby="scorer-title">
          <div class="scorer-head">
            <h2 id="scorer-title">Scorer controls</h2>
            <button type="button" class="btn btn-text" data-lock>Lock</button>
          </div>
          <label class="court-pick"><span>Court</span>
            <select data-court-pick><option value="">Not set</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
            <em>Optional. Shown on the match once set.</em>
          </label>
          <div class="point-buttons">
            <button type="button" class="point-btn point-a" data-point="A"><span>Point to</span><strong data-btn-team="A"></strong></button>
            <button type="button" class="point-btn point-b" data-point="B"><span>Point to</span><strong data-btn-team="B"></strong></button>
          </div>
          <div class="scorer-row">
            <button type="button" class="btn btn-ghost" data-undo>Undo last point</button>
            <button type="button" class="btn btn-text" data-delete>Delete this match's scores</button>
          </div>
          <div class="result-box" data-result hidden></div>
          <div class="publish-box">
            <p data-pending></p>
            <button type="button" class="btn btn-ghost" data-download>Download backup file</button>
          </div>
        </section>

        <form class="scorer passkey" data-passkey hidden aria-labelledby="passkey-title">
          <h2 id="passkey-title">Scorer passkey</h2>
          <label class="field">
            <span>Enter the passkey to score this match</span>
            <input type="password" name="passkey" autocomplete="current-password" required data-passkey-input>
          </label>
          <p class="form-error" data-passkey-error role="alert" hidden></p>
          <div class="scorer-row">
            <button type="submit" class="btn btn-live">Unlock scoring</button>
            <button type="button" class="btn btn-text" data-passkey-cancel>Cancel</button>
          </div>
        </form>

        <button type="button" class="btn btn-live btn-block" data-scorer-toggle hidden>Score this match</button>

        <section class="panel" aria-labelledby="sheet-title">
          <h2 id="sheet-title">Score sheet</h2>
          <div class="sheet" data-sheet tabindex="0" aria-label="Rally by rally score sheet"></div>
        </section>

        <section class="panel" aria-labelledby="stats-title" data-stats-panel hidden>
          <h2 id="stats-title">Match stats</h2>
          <div class="stats" data-stats></div>
        </section>

        <section class="panel" aria-labelledby="info-title">
          <h2 id="info-title">Match details</h2>
          <dl class="details" data-details></dl>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="sign-off">Rally. Compete. Connect.</p>
      <p>Organised by ThirdSpace by Losh.</p>
      <div class="credit-row">
        <div class="pill-row">
        <a class="made-by insta-pill" href="https://instagram.com/thirdspace_by_losh" target="_blank" rel="noopener">
          <svg class="insta-glyph" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ig-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f9a23b"/><stop offset=".5" stop-color="#ec3d7a"/><stop offset="1" stop-color="#8b4cf6"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="url(#ig-g)" stroke-width="2.4"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="url(#ig-g)" stroke-width="2.4"/><circle cx="17.4" cy="6.6" r="1.4" fill="#ec3d7a"/></svg>
          <span>Follow</span> <strong class="made-name">@thirdspace_by_losh</strong>
        </a>
        <a class="made-by" href="https://pavithranm.in" target="_blank" rel="noopener">
          <span>Created with</span>
          <svg class="made-heart" width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="love"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
          <span>by</span> <strong class="made-name">P12</strong>
          <span class="made-site">pavithranm.in</span>
        </a>
        </div>
        <p class="visits" data-visits hidden><span aria-hidden="true">👀</span> <strong data-visits-n></strong> visits</p>
        <p class="copyright">© 2026 P12 · <a href="privacy.html">Privacy</a></p>
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/match.js?v=20261025o"></script>
  <script type="module" src="assets/js/feedback.js?v=20261025o"></script>
  <script type="module" src="assets/js/visits.js?v=20261025o"></script>
</body>
</html>
